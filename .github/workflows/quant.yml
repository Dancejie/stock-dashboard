name: Quant checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build-public.py "$RUNNER_TEMP/quant-public"
      - run: node --test tests/*.test.cjs
      - run: python tools/verify-portfolio-ledger.py
      - run: python -B -m unittest discover -s tests -p 'test_*.py'
